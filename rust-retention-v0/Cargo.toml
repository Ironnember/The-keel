[package]
name = "pulpo-retention-v0"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "pulpo-retention-v0"
path = "src/main.rs"
